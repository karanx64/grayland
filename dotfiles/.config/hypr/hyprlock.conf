source = $HOME/.config/hypr/tokyoNightStorm.conf

$font = Inter Display
$font-nerd = RobotoMono Nerd Font Propo

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/Pictures/wallpapers/wallhaven/wallhaven-e8ek18.png
    color = $background
    blur_passes = 3
    blur_size = 8
    brightness = 1

}
# Profile Picture
image {
    monitor =
    path = ~/Pictures/small-pics/gamer-cat.png
    size = 100
    border_size = 8
    border_color = rgba($foregroundRaw33)
    position = 0, 200
    halign = center
    valign = bottom
}


