input-field {
    monitor =
    size = 200, 30
    outline_thickness = 4
    inner_color = rgba($foregroundRaw33)

    # outer_color = $green $sapphire 30deg
    # check_color = $red $peach 120deg
    # fail_color = $red $peach 30deg

    outer_color = rgba($foregroundRaw50)
    check_color = rgba($yellowRawff)
    fail_color = rgba($redRawff)

    font_color = rgba($foregroundRaw88)
    fade_on_empty = false
    rounding = 15

    font_family = $font-nerd
    placeholder_text =
    fail_text =

    # uncomment to use a letter instead of a dot to indicate the typed password
    dots_text_format = 󰜡
    dots_size = 0.4
    dots_spacing = 0.6

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, 80
    halign = center
    valign = bottom
}



# TIME
label {
    monitor =
    text = cmd[update:1]  date +"%l:%M"
    font_size = 120
    font_family = $font black
    position = 0, -200
    halign = center
    valign = top
    color = rgba($foregroundRaw50)
}

# day
label {
    monitor =
    text = cmd[update:1] date +"%a"
    font_size = 16
    font_family = $font
    position = -150, -380
    halign = center
    valign = top
    color = rgba($foregroundRaw50)
}

