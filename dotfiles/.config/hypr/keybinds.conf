
# See https://wiki.hypr.land/Configuring/Keywords/

$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, pkill wlogout || wlogout -b 5
bind = $mainMod, N, exec, $fileManager
bind = $mainMod, E, exec, $editor
bind = $mainMod, B, exec, $browser
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow



# Laptop multimedia keys for volume and LCD brightness
# changed from media key bindings to normal key bindings
bindel = Ctrl Shift, F4, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = Ctrl Shift, F1, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = Ctrl Shift, F2, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = Ctrl Shift, F3, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle



# Requires playerctl - changed from media key bindings to normal key bindings
bindl = Ctrl Shift, F8 , exec, playerctl next
bindl = Ctrl Shift, F6 , exec, playerctl play-pause
bindl = Ctrl Shift, F7 , exec, playerctl play-pause
bindl = Ctrl Shift, F5 , exec, playerctl previous


##################custom keybinds below###################

#clipboard + wofi
# bind = Ctrl $mainMod, V, exec, cliphist list | wofi --dmenu --pre-display-cmd "echo '%s' | cut -f 2" | cliphist decode | wl-copy

#hyprlock
bind = $mainMod, L, exec, hyprlock

#hyprshot - screenshot
bindl = ,Print , exec, hyprshot -m output -m HDMI-A-1
bind = Ctrl, Print, exec, hyprshot -m region
bind = Shift, Print, exec, hyprshot -m window

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod ctrl, right,workspace, e+1
bind = $mainMod ctrl, left, workspace, e-1

#move window - swap window actually
bind = $mainMod SHIFT, left, swapwindow,l
bind = $mainMod SHIFT, right, swapwindow,r
bind = $mainMod SHIFT, up, swapwindow,u
bind = $mainMod SHIFT, down, swapwindow,d

#resize window
bind = $mainMod alt, right, resizeactive, 40 0
bind = $mainMod alt, left, resizeactive, -40 0
bind = $mainMod alt, up, resizeactive, 0 -20
bind = $mainMod alt, down, resizeactive, 0 20

#fullscreen
bind = $mainMod, F, fullscreen

#ddcutil brightness from ~/.local/bin/brightness-adjust
#brightness-util <BUS> <CHANGE>
bind = Ctrl Shift, F12, execr, ~/.local/bin/brightness-util 0 10
bind = Ctrl Shift, F9, execr, ~/.local/bin/brightness-util 0 -10

#hyprsunset
bind = Ctrl Shift, F10, exec, pkill hyprsunset || hyprsunset
bind = Ctrl Shift, F11, exec, pkill hyprsunset || hyprsunset

#reload waybar
bind = $mainMod Shift, P, exec, pkill waybar || waybar
bind = $mainMod Ctrl, P, exec, swaync-client -rs
bind = $mainMod Ctrl, O, exec, swaync-client -R


bind = $mainMod, mouse:274, killactive


##################custom keybinds above###################
